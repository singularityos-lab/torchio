#
# Torchio IPP-over-USB quirks. Twenty years of broken printer firmware cannot be
# designed away, so the perversions live here as data, not as code. Load with:
#   torchio usb bridge --quirks /etc/torchio/usb-quirks.conf
#
# Section headers are VVVV:PPPP in hex (USB vendor:product); either field may be
# '*' to match any. A specific VID:PID overrides a wildcard. Keys:
#   usb-max-interfaces = N   cap concurrent IPP-over-USB interfaces
#   zlp-send = true          send a zero-length packet after a full bulk-OUT
#   reset-before = true      USB-reset the device before first use

# Conservative default for everything.
[*:*]
usb-max-interfaces = 1

# Examples (extend as real hardware is tested):
# [03f0:*]            ; HP
# zlp-send = true
#
# [04b8:*]            ; Epson
# reset-before = true
